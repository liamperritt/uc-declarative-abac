# Copy this workflow into YOUR governance repo's .github/workflows/ (it does not run
# from inside the example). It reconciles the YAML configs against Unity Catalog on
# every push to main and on a daily schedule, and does a dry-run on pull requests.
#
# Prerequisites (repo settings):
#   - secrets: DATABRICKS_HOST, DATABRICKS_TOKEN (or OAuth / Azure SP equivalents)
#   - variables: DATABRICKS_WAREHOUSE_ID
name: Deploy UC ABAC governance

on:
  pull_request:
    paths: ['configs/**', 'uc_abac.yml']
  push:
    branches: [main]
    paths: ['configs/**', 'uc_abac.yml']
  schedule:
    # Twice daily: catch expiry_date transitions and re-sync any drift.
    - cron: '0 7 * * *'
    - cron: '0 19 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: liamperritt/uc-declarative-abac/deploy@v0.10.0
        with:
          config-dir: configs/
          warehouse-id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          timezone: Europe/London
          # Additive management (matches uc_abac.yml).
          tag-management-scopes: '*'
          privilege-management-scopes: '*'
          taggable-management-scopes: '*'
          taggable-creation-scopes: '*'
          # Create the group hierarchy and reconcile membership (account SCIM proxy).
          group-creation-scopes: 'uc_abac_*'
          group-management-scopes: 'uc_abac_*'
          # Preview on PRs, apply on push/schedule.
          dry-run: ${{ github.event_name == 'pull_request' }}
          # Required in CI once any destructive gate (policy/governed-tag/group
          # deletion) is enabled; harmless otherwise.
          force: 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
