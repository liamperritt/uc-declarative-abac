# Region-partitioned raw layer: this ONE definition is instantiated three times by
# the catalog (region = amer / emea / apac), producing transactions_bronze_amer,
# _emea and _apac. Each instance reuses the same three raw table defs and inlines
# its own landing volumes.
definitions:
  schemas:
    uc_abac_finance|transactions_bronze:
      $ref: $defs/schemas/uc_abac_finance|base_transactions
      $vars:
        env: ~
        region: ~
        layer: bronze
      name: transactions_bronze_{{ region }}
      comment: Transaction bronze zone for the {{ region }} region.
      tags:
        uc_abac_region: '{{ region }}'
      policies:
        - $ref: $defs/policies/region|grant_regional_bronze_read
          $vars:
            region: '{{ region }}'
      volumes:
        # Inlined because these volumes are not reused by any other schema.
        - name: raw_files
          comment: Landing volume for raw {{ region }} extract files.
          tags:
            uc_abac_domain: transaction
        - name: quarantine
          comment: Quarantine volume for records that fail validation.
          tags:
            uc_abac_domain: transaction
