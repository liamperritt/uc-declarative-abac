# Row-level security for large-transaction oversight: hide individually large
# transactions from everyone except data governors. Keys on the uc_abac_sensitivity
# tag applied to the amount column. Demonstrates an INLINE filter function.
definitions:
  policies:
    sensitivity|filter_large_transactions:
      name: filter_large_transactions
      comment: Hide transactions at or above the review threshold from non-governors.
      type: filter
      columns:
        - alias: amount
          has_tags:
            uc_abac_sensitivity: high
      function:
        comment: Visible when the amount is below the review threshold or the caller is a governor.
        parameters:
          - name: amount
            type: decimal(18,2)
        return: "amount < 1000000 OR is_account_group_member('uc_abac_data_governors')"
      to:
        - account users
      except:
        - account admins
