definitions:
  policies:
    pii|mask_pii:
      $params:
        pipeline: ~
        constant: '####'
        test: ~
      name: mask_pii
      comment: Policy for masking columns with PII values via 'uc_gov_pii' column tag
      type: mask
      columns:
        - alias: pii
          has_any_of_tags:
            uc_gov_pii: '*'
            uc_gov_pipeline: '{{ pipeline }}'
        - constant: '{{ constant }}'
      function:
        parameters:
          - name: pii
            type: string
          - name: mask_value
            type: string
        return: "CONCAT(mask_value, SUBSTRING(pii, -4))"
      except:
        - uc_governor_data_engineers
