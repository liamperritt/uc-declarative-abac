definitions:
  policies:
    pii|mask_pii:
      $vars:
        pipeline: ~
        constant: '####'
      name: mask_pii
      comment: Policy for masking columns with PII values via 'uc_gov_pii' column tag
      type: mask
      has_tags:
        uc_gov_pipeline: '*'
      columns:
        - alias: pii
          has_any_of_tags:
            uc_gov_pii: '*'
            uc_gov_pipeline: '{{ pipeline }}'
          has_none_of_tags:
            uc_gov_zone: bronze
            uc_gov_managed_by: uc_declarative_abac
        - constant: '{{ constant }}'
        - expression:
            get_column_tag_value:
              alias: pii
              tag: uc_gov_pipeline
        - expression:
            get_tag_value:
              tag: uc_gov_pipeline

      function:
        parameters:
          - name: pii
            type: string
          - name: mask_value
            type: string
          - name: pipeline1
            type: string
          - name: pipeline2
            type: string
        return: "CONCAT(mask_value, SUBSTRING(pii, -4))"
      except:
        - uc_governor_data_engineers
