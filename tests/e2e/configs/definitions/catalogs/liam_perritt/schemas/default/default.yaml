definitions:
  schemas:
    liam_perritt|default:
      $ref: $defs/schemas/liam_perritt|base_policies
      $vars:
        env: ~
        team: platform
      name: default
      tags:
        uc_gov_team: '{{ team }}'
        uc_gov_certified: ~
      volumes:
        - name: test_volume
          owner: uc_governor_{{ env }}_team
          tags:
            uc_gov_classification: internal
      functions:
        - $ref: $defs/functions/abac|format_phone
          $vars:
            env: '{{ env }}'
      tables:
        - name: batch_table
          tags:
            uc_gov_classification: internal
            class.name: ~
          columns:
            - name: col1
              type: string
              tags:
                uc_gov_team: platform
        - name: test_table
          tags:
            uc_gov_classification: internal
          columns:
            - name: col1
              type: string
              tags:
                uc_gov_team: platform
