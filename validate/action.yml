name: Validate UC Declarative ABAC
description: >-
  Offline validation of Unity Catalog ABAC configs — parse, resolve, and
  validate the YAML without contacting Databricks (no warehouse or credentials).
author: Liam Perritt
branding:
  icon: check-circle
  color: blue

inputs:
  config-dir:
    description: Path to the YAML config directory, relative to the caller's repo root.
    required: true
  ref-override-strategy:
    description: >-
      How sibling fields on a $ref entry combine with the referenced definition.
      "merge" (default) recursively deep-merges maps and lists; "replace" shallowly
      replaces top-level keys (legacy behaviour).
    required: false
    default: 'merge'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uc-declarative-abac
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$ACTION_PATH/.."

    - name: Run uc-abac validate
      shell: bash
      env:
        CONFIG_DIR: ${{ inputs.config-dir }}
        REF_OVERRIDE_STRATEGY: ${{ inputs.ref-override-strategy }}
      run: |
        args=(
          "validate"
          --config-dir "$CONFIG_DIR"
        )
        if [[ -n "$REF_OVERRIDE_STRATEGY" ]]; then
          args+=(--ref-override-strategy "$REF_OVERRIDE_STRATEGY")
        fi
        uc-abac "${args[@]}"
